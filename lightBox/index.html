<body>


  <!--******************************** 3D Models ***************************************************-->



  <!-- ==============================start======================= -->

  <div class="lightbox-target" id="SDTD-model">
    <div class="position-relative bg-[#6b8f8f] background_color1">

      <model-viewer src="./assets/models/SDTD-model.glb" ar-modes="webxr scene-viewer quick-look"
        camera-controls camera-orbit="-90.98deg 82.86deg 1.864m" field-of-view="30deg" min-camera-orbit="auto auto 1.74m" min-field-of-view="26.26deg" tone-mapping="agx" shadow-softness="0"
        poster="poster.webp" shadow-intensity="1" disable-pan disable-tap></model-viewer>
      <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
      </div>

      </model-viewer>
    </div>

    <a class="lightbox-close" href="#" onclick="javascript:window.close()"></a>
    <div class="deg">
      <img src="./assets/images/360-degrees.webp" alt="">
    </div>



  </div>





  <!--******************* model end*************************-->



  <!-- *************************Background color************************ -->

  <script>


    function initBgColor1() {
      const picker1 = document.getElementById("bgColorPicker1");
      const bg1 = document.querySelector(".background_color1");

      if (!picker1 || !bg1) return;

      const updateColor1 = (color) => {
        bg1.style.backgroundColor = color;
      };

      picker1.addEventListener("input", (e) => updateColor1(e.target.value));


      picker1.addEventListener("change", (e) => updateColor1(e.target.value));


      picker1.addEventListener("click", () => picker1.focus());
    }


    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(initBgColor1, 200);
    });
  </script>


  <script src='./js/jquery-2.0.3.min.js'></script>

  <script type="module" src="./js/model-viewer.min.js"></script>
  <link rel="stylesheet" href="./css/font-awesome.min.css">
  <script src="./js/three.min.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</body>
